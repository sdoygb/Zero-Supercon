[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-supercon"
version = "1.0.0"
description = "From alpha^2F to Tc: a parameter-free chain (Zero library, Zb072 §11)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zero Library" }]
dependencies = ["numpy>=1.20"]
keywords = ["superconductivity", "critical temperature", "electron-phonon"]

[project.urls]
Source = "https://github.com/sdoygb/Zero-Supercon"

[tool.setuptools.packages.find]
include = ["zero_supercon*"]
